<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sand Saga - Mobile & QoL Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        h1 {
            margin: 5px 0 10px 0;
            font-size: 1.4rem;
        }
        .canvas-container {
            position: relative;
            touch-action: none; /* Prevents scroll when drawing */
        }
        canvas {
            border: 2px solid #333;
            background-color: #000;
            cursor: crosshair;
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        /* Mobile Control Bar */
        .qol-bar {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 8px;
        }
        .qol-bar label {
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        /* Material Buttons Container */
        .controls {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px;
            width: 100%;
            max-width: 600px;
            max-height: 180px;
            overflow-y: auto;
            padding: 6px;
            background: #1e1e1e;
            border-radius: 8px;
        }
        
        button {
            padding: 10px 6px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            font-size: 12px;
            touch-action: manipulation;
        }
        button:active { opacity: 0.7; }
        button.active { outline: 3px solid #fff; }

        /* QoL Control Styles */
        .btn-qol { background-color: #333; }
        .btn-qol.active { background-color: #007acc; }

        /* Material Colors */
        .btn-sand { background-color: #e0c068; color: #000; }
        .btn-water { background-color: #4080ff; }
        .btn-wood { background-color: #8b5a2b; }
        .btn-fire { background-color: #ff4500; }
        .btn-acid { background-color: #32cd32; color: #000; }
        .btn-oil { background-color: #554433; }
        .btn-nitro { background-color: #ff0055; }
        .btn-wall { background-color: #777777; }
        .btn-eraser { background-color: #444; }
        .btn-clear { background-color: #a00; }

        /* Custom Slider for Touch */
        input[type=range] {
            width: 80px;
        }
    </style>
</head>
<body>

    <h1>Sand Saga Simulator</h1>

    <div class="canvas-container">
        <canvas id="canvas" width="200" height="150" style="width: 600px; height: 450px;"></canvas>
    </div>

    <!-- Pause & QoL Toolbar -->
    <div class="qol-bar">
        <button id="btn-pause" class="btn-qol" onclick="togglePause()">⏸️ Pause</button>
        <button id="btn-step" class="btn-qol" onclick="stepFrame()" disabled>⏭️ Step</button>
        <label for="brush-size">Size: <span id="size-val">2</span></label>
        <input type="range" id="brush-size" min="1" max="10" value="2" oninput="updateBrushSize(this.value)">
        <button class="btn-clear" onclick="clearCanvas()">🗑️ Clear</button>
    </div>

    <!-- Material Palette -->
    <div class="controls" id="btn-container">
        <button class="btn-sand active" onclick="selectElement('sand', this)">Sand</button>
        <button class="btn-water" onclick="selectElement('water', this)">Water</button>
        <button class="btn-wood" onclick="selectElement('wood', this)">Wood</button>
        <button class="btn-fire" onclick="selectElement('fire', this)">Fire</button>
        <button class="btn-acid" onclick="selectElement('acid', this)">Acid</button>
        <button class="btn-oil" onclick="selectElement('oil', this)">Oil</button>
        <button class="btn-nitro" onclick="selectElement('nitro', this)">Nitro</button>
        <button class="btn-wall" onclick="selectElement('wall', this)">Wall</button>
        <button class="btn-eraser" onclick="selectElement('empty', this)">Eraser</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        let grid = Array(width * height).fill(0);
        let currentElement = 'sand';
        let brushSize = 2;
        let isPaused = false;
        let stepRequested = false;
        let isDrawing = false;

        const ELEMENTS = {
            empty: { id: 0, color: [0, 0, 0] },
            sand:  { id: 1, color: [224, 192, 104] },
            water: { id: 2, color: [64, 128, 255] },
            wood:  { id: 3, color: [139, 90, 43] },
            fire:  { id: 4, color: [255, 69, 0] },
            acid:  { id: 5, color: [50, 205, 50] },
            oil:   { id: 6, color: [85, 68, 51] },
            nitro: { id: 7, color: [255, 0, 85] },
            wall:  { id: 8, color: [119, 119, 119] }
        };

        function getIndex(x, y) { return y * width + x; }

        function selectElement(type, btn) {
            currentElement = type;
            document.querySelectorAll('#btn-container button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        /* QoL Pause Controls */
        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('btn-pause');
            const stepBtn = document.getElementById('btn-step');
            
            if (isPaused) {
                pauseBtn.innerText = '▶️ Play';
                pauseBtn.classList.add('active');
                stepBtn.disabled = false;
            } else {
                pauseBtn.innerText = '⏸️ Pause';
                pauseBtn.classList.remove('active');
                stepBtn.disabled = true;
            }
        }

        function stepFrame() {
            if (isPaused) stepRequested = true;
        }

        function updateBrushSize(val) {
            brushSize = parseInt(val, 10);
            document.getElementById('size-val').innerText = brushSize;
        }

        function clearCanvas() {
            grid = Array(width * height).fill(0);
        }

        /* Touch & Mouse Event Handling for Painting */
        function handlePointerStart(e) {
            isDrawing = true;
            paint(e);
        }

        function handlePointerMove(e) {
            if (isDrawing) paint(e);
        }

        function handlePointerEnd() {
            isDrawing = false;
        }

        function paint(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const mouseX = Math.floor((clientX - rect.left) * scaleX);
            const mouseY = Math.floor((clientY - rect.top) * scaleY);

            for (let dx = -brushSize + 1; dx < brushSize; dx++) {
                for (let dy = -brushSize + 1; dy < brushSize; dy++) {
                    const x = mouseX + dx;
                    const y = mouseY + dy;
                    if (x >= 0 && x < width && y >= 0 && y < height) {
                        grid[getIndex(x, y)] = ELEMENTS[currentElement].id;
                    }
                }
            }
        }

        // Attach both Touch and Mouse listeners
        canvas.addEventListener('mousedown', handlePointerStart);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerEnd);

        canvas.addEventListener('touchstart', handlePointerStart, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevents touch scrolling on canvas area
            handlePointerMove(e);
        }, { passive: false });
        window.addEventListener('touchend', handlePointerEnd);

        /* Simulation Logic */
        function update() {
            let nextGrid = [...grid];

            for (let y = height - 1; y >= 0; y--) {
                for (let x = 0; x < width; x++) {
                    const idx = getIndex(x, y);
                    const type = grid[idx];

                    if (type === 0 || type === 3 || type === 8) continue; // Static

                    // Sand Logic
                    if (type === 1) {
                        const below = getIndex(x, y + 1);
                        if (y + 1 < height) {
                            if (grid[below] === 0 || grid[below] === 2) {
                                nextGrid[idx] = grid[below];
                                nextGrid[below] = 1;
                            }
                        }
                    }
                    // Liquid Logic (Water, Acid, Oil, Nitro)
                    else if (type === 2 || type === 5 || type === 6 || type === 7) {
                        const below = getIndex(x, y + 1);
                        if (y + 1 < height && grid[below] === 0) {
                            nextGrid[idx] = 0;
                            nextGrid[below] = type;
                        } else {
                            let dir = Math.random() < 0.5 ? -1 : 1;
                            let sideIdx = getIndex(x + dir, y);
                            if (x + dir >= 0 && x + dir < width && grid[sideIdx] === 0) {
                                nextGrid[idx] = 0;
                                nextGrid[sideIdx] = type;
                            }
                        }

                        // Acid Interaction
                        if (type === 5) {
                            checkNeighbors(x, y, (nIdx) => {
                                if (grid[nIdx] !== 0 && grid[nIdx] !== 5 && Math.random() < 0.3) {
                                    nextGrid[nIdx] = 0;
                                    nextGrid[idx] = 0;
                                }
                            });
                        }
                    }
                    // Fire Logic
                    else if (type === 4) {
                        if (Math.random() < 0.2) nextGrid[idx] = 0;
                        checkNeighbors(x, y, (nIdx) => {
                            if (grid[nIdx] === 3 || grid[nIdx] === 6 || grid[nIdx] === 7) {
                                nextGrid[nIdx] = 4; // Ignite wood, oil, or nitro
                            }
                        });
                    }
                }
            }
            grid = nextGrid;
        }

        function checkNeighbors(x, y, callback) {
            const neighbors = [
                {x: x, y: y - 1}, {x: x, y: y + 1},
                {x: x - 1, y: y}, {x: x + 1, y: y}
            ];
            neighbors.forEach(n => {
                if (n.x >= 0 && n.x < width && n.y >= 0 && n.y < height) {
                    callback(getIndex(n.x, n.y));
                }
            });
        }

        function draw() {
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let i = 0; i < grid.length; i++) {
                const type = grid[i];
                let color = [0, 0, 0];

                switch(type) {
                    case 1: color = ELEMENTS.sand.color; break;
                    case 2: color = ELEMENTS.water.color; break;
                    case 3: color = ELEMENTS.wood.color; break;
                    case 4: color = [255, Math.floor(Math.random() * 180), 0]; break;
                    case 5: color = ELEMENTS.acid.color; break;
                    case 6: color = ELEMENTS.oil.color; break;
                    case 7: color = ELEMENTS.nitro.color; break;
                    case 8: color = ELEMENTS.wall.color; break;
                }

                const pixelIdx = i * 4;
                data[pixelIdx]     = color[0];
                data[pixelIdx + 1] = color[1];
                data[pixelIdx + 2] = color[2];
                data[pixelIdx + 3] = 255;
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function loop() {
            if (!isPaused || stepRequested) {
                update();
                stepRequested = false;
            }
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
