<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Powder Box Sandbox - Automation & Mechanics Edition</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            background: #0d0d11;
            color: #eceff4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            touch-action: none;
            overflow: hidden;
        }
        h2 {
            margin: 2px 0 6px 0;
            color: #88c0d0;
            font-size: 20px;
            text-align: center;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 8px 30px rgba(0,0,0,0.9);
            border-radius: 6px;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background: #000;
            cursor: crosshair;
            display: block;
            image-rendering: pixelated;
            touch-action: none;
        }
        .control-panel {
            margin-top: 8px;
            max-width: 900px;
            width: 100%;
            background: #181920;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2e3440;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 38vh;
            overflow-y: auto;
        }
        .settings {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid #2e3440;
            padding-bottom: 6px;
            flex-wrap: wrap;
        }
        .categories {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .cat-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .cat-label {
            font-size: 10px;
            font-weight: bold;
            color: #d8dee9;
            width: 80px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button {
            background: #2e3440;
            color: #e5e9f0;
            border: 1px solid #4c566a;
            padding: 7px 9px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            touch-action: manipulation;
        }
        button:active, button.active {
            background: #5e81ac;
            border-color: #81a1c1;
            color: #fff;
            box-shadow: 0 0 6px rgba(94,129,172,0.6);
        }
        .btn-action { background: #bf616a; border-color: #d08770; color: #fff; }
        .btn-action:active { background: #d08770; }
        .btn-save { background: #a3be8c; border-color: #8fbcbb; color: #2e3440; font-weight: bold; }
        select, input[type=range], input[type=color] {
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <h2>Powder Box Sandbox</h2>

    <div id="canvas-container">
        <canvas id="canvas" width="280" height="180" style="width: 840px; height: 540px;"></canvas>
    </div>

    <div class="control-panel">
        <div class="settings">
            <label>Brush: <input type="range" id="brushSize" min="1" max="15" value="3"></label>
            <span id="brushVal">3px</span>
            
            <label style="margin-left: 6px;">Gravity: 
                <select id="gravityDir">
                    <option value="DOWN">Down</option>
                    <option value="UP">Up</option>
                    <option value="ZERO">Zero-G</option>
                </select>
            </label>

            <label style="margin-left: 6px;">Slot:
                <select id="saveSlot">
                    <option value="slot1">Slot 1</option>
                    <option value="slot2">Slot 2</option>
                    <option value="slot3">Slot 3</option>
                </select>
            </label>
            <button class="btn-save" id="saveBtn">Save</button>
            <button class="btn-save" id="loadBtn">Load</button>

            <label style="margin-left: 6px;">Custom Color: <input type="color" id="customColorPicker" value="#ff0055"></label>

            <button class="btn-action" id="clearBtn">Clear Grid</button>
            <button class="btn-action" id="explodeBtn">Detonate All</button>
            <span id="fps" style="margin-left: auto; color: #81a1c1; font-family: monospace;">FPS: 60</span>
        </div>

        <div class="categories" id="elementContainer"></div>
    </div>

<script>
const WIDTH = 280;
const HEIGHT = 180;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imgData = ctx.createImageData(WIDTH, HEIGHT);

// Master Element Definitions
const ELEMENTS = {
    EMPTY:       { id: 0,  color: [0, 0, 0, 255],       cat: 'Tools' },
    WALL:        { id: 1,  color: [120, 120, 120, 255], cat: 'Solids' },
    WOOD:        { id: 2,  color: [139, 69, 19, 255],   cat: 'Solids' },
    GLASS:       { id: 3,  color: [200, 240, 255, 100], cat: 'Solids' },
    ICE:         { id: 4,  color: [170, 220, 255, 200], cat: 'Solids' },
    TORCH:       { id: 5,  color: [255, 180, 0, 255],   cat: 'Solids' },
    BOUNCY:      { id: 6,  color: [255, 105, 180, 255], cat: 'Solids' },
    C4:          { id: 7,  color: [200, 160, 120, 255], cat: 'Solids' },

    COPPER:      { id: 8,  color: [184, 115, 51, 255],  cat: 'Electricity' },
    SPARK:       { id: 9,  color: [255, 255, 100, 255], cat: 'Electricity' },
    ELECTRIC:    { id: 10, color: [0, 240, 255, 255],   cat: 'Electricity' },
    SENSOR:      { id: 11, color: [160, 160, 80, 255],  cat: 'Electricity' },
    AND_GATE:    { id: 12, color: [100, 180, 100, 255], cat: 'Electricity' },
    NOT_GATE:    { id: 13, color: [220, 100, 100, 255], cat: 'Electricity' },

    SAND:        { id: 14, color: [230, 200, 110, 255], cat: 'Powders' },
    GUNPOWDER:   { id: 15, color: [90, 90, 90, 255],    cat: 'Powders' },
    SALT:        { id: 16, color: [240, 240, 240, 255], cat: 'Powders' },
    SEED:        { id: 17, color: [80, 200, 80, 255],   cat: 'Powders' },
    TERMITE:     { id: 18, color: [210, 140, 80, 255],  cat: 'Powders' },
    SNOW:        { id: 19, color: [250, 250, 255, 255], cat: 'Powders' },

    WATER:       { id: 20, color: [50, 150, 255, 255],  cat: 'Liquids' },
    OIL:         { id: 21, color: [160, 110, 20, 255],  cat: 'Liquids' },
    ACID:        { id: 22, color: [100, 255, 0, 255],   cat: 'Liquids' },
    LAVA:        { id: 23, color: [255, 100, 0, 255],   cat: 'Liquids' },
    NITRO:       { id: 24, color: [0, 200, 150, 255],   cat: 'Liquids' },

    FIRE:        { id: 25, color: [255, 60, 0, 255],    cat: 'Energy' },

    SMOKE:       { id: 26, color: [100, 100, 100, 180], cat: 'Gases' },
    GAS:         { id: 27, color: [180, 220, 100, 150], cat: 'Gases' },
    METHANE:     { id: 28, color: [220, 150, 255, 160], cat: 'Gases' },
    STEAM:       { id: 29, color: [220, 220, 240, 160], cat: 'Gases' },

    DISPENSER:   { id: 30, color: [255, 140, 0, 255],   cat: 'Special' },
    WATER_DISP:  { id: 31, color: [0, 100, 255, 255],   cat: 'Special' },
    LAVA_DISP:   { id: 32, color: [200, 50, 0, 255],    cat: 'Special' },
    CONVEY_L:    { id: 33, color: [70, 130, 180, 255],  cat: 'Special' },
    CONVEY_R:    { id: 34, color: [100, 149, 237, 255], cat: 'Special' },
    HOPPER:      { id: 35, color: [140, 100, 180, 255], cat: 'Special' },
    PISTON:      { id: 36, color: [180, 140, 100, 255], cat: 'Special' },
    STICKY_PIST: { id: 37, color: [140, 180, 100, 255], cat: 'Special' },
    VIRUS:       { id: 38, color: [200, 0, 200, 255],   cat: 'Special' },
    CLONE:       { id: 39, color: [255, 0, 200, 255],   cat: 'Special' },
    VOID:        { id: 40, color: [150, 0, 0, 255],     cat: 'Special' },
    FAN:         { id: 41, color: [80, 180, 200, 255],  cat: 'Special' },
    CUSTOM:      { id: 42, color: [255, 0, 85, 255],    cat: 'Tools' },
    ERASER:      { id: 43, color: [0, 0, 0, 255],       cat: 'Tools' }
};

let grid = new Uint8Array(WIDTH * HEIGHT);
let cloneTypes = new Uint8Array(WIDTH * HEIGHT);
let dispenserTypes = new Uint8Array(WIDTH * HEIGHT);
let pistonState = new Uint8Array(WIDTH * HEIGHT); // 0=retracted, 1=extended
let pistonPushedType = new Uint8Array(WIDTH * HEIGHT);
let life = new Uint8Array(WIDTH * HEIGHT);
let customColorMap = new Array(WIDTH * HEIGHT);
let activeElement = ELEMENTS.SAND.id;
let gravityMode = 'DOWN';

// Build UI Elements
const container = document.getElementById('elementContainer');
const categories = ['Powders', 'Liquids', 'Solids', 'Gases', 'Electricity', 'Energy', 'Special', 'Tools'];

categories.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'cat-row';
    const label = document.createElement('span');
    label.className = 'cat-label';
    label.textContent = cat;
    row.appendChild(label);

    Object.keys(ELEMENTS).forEach(key => {
        const el = ELEMENTS[key];
        if (el.cat === cat && key !== 'EMPTY') {
            const btn = document.createElement('button');
            btn.textContent = key.replace('_DISP', ' SPN').replace('CONVEY_', 'BELT ');
            if (el.id === activeElement) btn.classList.add('active');
            btn.onclick = () => {
                document.querySelectorAll('.categories button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeElement = el.id;
            };
            row.appendChild(btn);
        }
    });
    container.appendChild(row);
});

const brushInput = document.getElementById('brushSize');
brushInput.oninput = (e) => document.getElementById('brushVal').textContent = e.target.value + 'px';
document.getElementById('gravityDir').onchange = (e) => gravityMode = e.target.value;

document.getElementById('clearBtn').onclick = () => {
    grid.fill(0);
    life.fill(0);
    cloneTypes.fill(0);
    dispenserTypes.fill(0);
    pistonState.fill(0);
    pistonPushedType.fill(0);
    customColorMap.fill(undefined);
};

document.getElementById('explodeBtn').onclick = () => {
    for (let i = 0; i < grid.length; i++) {
        if (grid[i] === ELEMENTS.GUNPOWDER.id || grid[i] === ELEMENTS.C4.id || grid[i] === ELEMENTS.NITRO.id || grid[i] === ELEMENTS.METHANE.id) {
            grid[i] = ELEMENTS.FIRE.id;
            life[i] = 20;
        }
    }
};

// Save & Load System
function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16), 255] : [255, 0, 85, 255];
}

document.getElementById('saveBtn').onclick = () => {
    const slot = document.getElementById('saveSlot').value;
    const saveData = {
        grid: Array.from(grid),
        cloneTypes: Array.from(cloneTypes),
        dispenserTypes: Array.from(dispenserTypes),
        customColorMap: customColorMap
    };
    localStorage.setItem('powder_sandbox_' + slot, JSON.stringify(saveData));
    alert('Saved to ' + slot.toUpperCase() + '!');
};

document.getElementById('loadBtn').onclick = () => {
    const slot = document.getElementById('saveSlot').value;
    const dataStr = localStorage.getItem('powder_sandbox_' + slot);
    if (!dataStr) {
        alert('No save found in ' + slot.toUpperCase());
        return;
    }
    const saveData = JSON.parse(dataStr);
    grid.set(saveData.grid);
    cloneTypes.set(saveData.cloneTypes);
    dispenserTypes.set(saveData.dispenserTypes);
    customColorMap = saveData.customColorMap || new Array(WIDTH * HEIGHT);
};

// Touch / Mouse Drawing
let isDrawing = false;

function applyBrush(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const cx = Math.floor((clientX - rect.left) * (WIDTH / rect.width));
    const cy = Math.floor((clientY - rect.top) * (HEIGHT / rect.height));
    const radius = parseInt(brushInput.value);

    for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
            if (dx*dx + dy*dy <= radius*radius) {
                const x = cx + dx;
                const y = cy + dy;
                if (x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT) {
                    const idx = y * WIDTH + x;
                    const fill = (activeElement === ELEMENTS.ERASER.id) ? 0 : activeElement;
                    grid[idx] = fill;
                    life[idx] = 0;
                    
                    if (fill === ELEMENTS.CUSTOM.id) {
                        const hex = document.getElementById('customColorPicker').value;
                        customColorMap[idx] = hexToRgb(hex);
                    } else {
                        customColorMap[idx] = undefined;
                    }

                    if (fill === ELEMENTS.FIRE.id) life[idx] = 12 + Math.random() * 8;
                    if (fill === ELEMENTS.ELECTRIC.id) life[idx] = 5;
                    if (fill === ELEMENTS.SMOKE.id || fill === ELEMENTS.STEAM.id || fill === ELEMENTS.METHANE.id) life[idx] = 40 + Math.random() * 20;
                }
            }
        }
    }
}

function startDraw(e) {
    isDrawing = true;
    const pos = e.touches ? e.touches[0] : e;
    applyBrush(pos.clientX, pos.clientY);
}

function moveDraw(e) {
    if (!isDrawing) return;
    const pos = e.touches ? e.touches[0] : e;
    applyBrush(pos.clientX, pos.clientY);
    if (e.touches) e.preventDefault();
}

function stopDraw() {
    isDrawing = false;
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', stopDraw);

canvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', moveDraw, { passive: false });
window.addEventListener('touchend', stopDraw);
window.addEventListener('touchcancel', stopDraw);

// Cellular Physics & Machine Engine
function update() {
    const nextGrid = new Uint8Array(grid);
    const gDir = (gravityMode === 'DOWN') ? 1 : (gravityMode === 'UP') ? -1 : 0;

    for (let y = (gDir >= 0 ? HEIGHT - 1 : 0); (gDir >= 0 ? y >= 0 : y < HEIGHT); y -= (gDir >= 0 ? 1 : -1)) {
        for (let x = 0; x < WIDTH; x++) {
            const i = y * WIDTH + x;
            const type = grid[i];

            if (type === ELEMENTS.EMPTY.id || type === ELEMENTS.WALL.id || type === ELEMENTS.GLASS.id) continue;

            const targetY = y + gDir;
            const down = targetY * WIDTH + x;
            const up = (y - 1) * WIDTH + x;
            const left = y * WIDTH + (x - 1);
            const right = y * WIDTH + (x + 1);
            const downLeft = targetY * WIDTH + (x - 1);
            const downRight = targetY * WIDTH + (x + 1);

            // SENSOR (Generates power if something is above it)
            if (type === ELEMENTS.SENSOR.id) {
                if (y > 0 && grid[up] !== ELEMENTS.EMPTY.id && grid[up] !== ELEMENTS.ELECTRIC.id) {
                    [left, right, down].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] === ELEMENTS.COPPER.id) {
                            nextGrid[adj] = ELEMENTS.ELECTRIC.id;
                            life[adj] = 4;
                        }
                    });
                }
                continue;
            }

            // LOGIC GATES (AND & NOT)
            if (type === ELEMENTS.AND_GATE.id) {
                const leftPowered = x > 0 && grid[left] === ELEMENTS.ELECTRIC.id;
                const rightPowered = x < WIDTH - 1 && grid[right] === ELEMENTS.ELECTRIC.id;
                if (leftPowered && rightPowered) {
                    if (y > 0 && grid[up] === ELEMENTS.COPPER.id) { nextGrid[up] = ELEMENTS.ELECTRIC.id; life[up] = 4; }
                    if (y < HEIGHT - 1 && grid[down] === ELEMENTS.COPPER.id) { nextGrid[down] = ELEMENTS.ELECTRIC.id; life[down] = 4; }
                }
                continue;
            }

            if (type === ELEMENTS.NOT_GATE.id) {
                const isInputActive = (x > 0 && grid[left] === ELEMENTS.ELECTRIC.id) || 
                                     (x < WIDTH - 1 && grid[right] === ELEMENTS.ELECTRIC.id) || 
                                     (y < HEIGHT - 1 && grid[down] === ELEMENTS.ELECTRIC.id);
                if (!isInputActive && y > 0 && grid[up] === ELEMENTS.COPPER.id) {
                    nextGrid[up] = ELEMENTS.ELECTRIC.id;
                    life[up] = 4;
                }
                continue;
            }

            // PISTON & STICKY PISTON
            if (type === ELEMENTS.PISTON.id || type === ELEMENTS.STICKY_PIST.id) {
                const isPowered = (x > 0 && grid[left] === ELEMENTS.ELECTRIC.id) ||
                                  (x < WIDTH - 1 && grid[right] === ELEMENTS.ELECTRIC.id) ||
                                  (y < HEIGHT - 1 && grid[down] === ELEMENTS.ELECTRIC.id);

                if (isPowered && pistonState[i] === 0 && y > 1) {
                    // Extend piston upward
                    const aboveItem = grid[up];
                    const aboveTwo = (y - 2) * WIDTH + x;
                    if (grid[aboveTwo] === ELEMENTS.EMPTY.id) {
                        nextGrid[aboveTwo] = aboveItem;
                        nextGrid[up] = ELEMENTS.WALL.id; // Piston Shaft
                        pistonState[i] = 1;
                        pistonPushedType[i] = aboveItem;
                    }
                } else if (!isPowered && pistonState[i] === 1 && y > 1) {
                    // Retract piston
                    if (type === ELEMENTS.STICKY_PIST.id) {
                        const aboveTwo = (y - 2) * WIDTH + x;
                        const topItem = grid[aboveTwo];
                        nextGrid[up] = topItem;
                        nextGrid[aboveTwo] = ELEMENTS.EMPTY.id;
                    } else {
                        nextGrid[up] = ELEMENTS.EMPTY.id;
                    }
                    pistonState[i] = 0;
                }
                continue;
            }

            // TORCH
            if (type === ELEMENTS.TORCH.id) {
                if (y > 0 && grid[up] === ELEMENTS.EMPTY.id) {
                    nextGrid[up] = ELEMENTS.FIRE.id;
                    life[up] = 10;
                }
                continue;
            }

            // CONVEYOR BELTS
            if (type === ELEMENTS.CONVEY_L.id || type === ELEMENTS.CONVEY_R.id) {
                if (y > 0) {
                    const aboveItem = grid[up];
                    if (aboveItem !== ELEMENTS.EMPTY.id && aboveItem !== ELEMENTS.WALL.id) {
                        const shiftX = (type === ELEMENTS.CONVEY_L.id) ? x - 1 : x + 1;
                        if (shiftX >= 0 && shiftX < WIDTH) {
                            const dest = (y - 1) * WIDTH + shiftX;
                            if (grid[dest] === ELEMENTS.EMPTY.id) {
                                nextGrid[dest] = aboveItem;
                                nextGrid[up] = ELEMENTS.EMPTY.id;
                            }
                        }
                    }
                }
                continue;
            }

            // VIRUS MECHANIC
            if (type === ELEMENTS.VIRUS.id) {
                [down, up, left, right].forEach(adj => {
                    if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] !== ELEMENTS.EMPTY.id && grid[adj] !== ELEMENTS.WALL.id && grid[adj] !== ELEMENTS.GLASS.id && grid[adj] !== ELEMENTS.VIRUS.id) {
                        if (Math.random() < 0.05) {
                            nextGrid[adj] = ELEMENTS.VIRUS.id;
                        }
                    }
                });
                continue;
            }

            // ICE MECHANICS
            if (type === ELEMENTS.ICE.id) {
                [down, up, left, right].forEach(adj => {
                    if (adj >= 0 && adj < WIDTH * HEIGHT) {
                        if (grid[adj] === ELEMENTS.WATER.id && Math.random() < 0.02) {
                            nextGrid[adj] = ELEMENTS.ICE.id;
                        } else if (grid[adj] === ELEMENTS.FIRE.id || grid[adj] === ELEMENTS.LAVA.id) {
                            nextGrid[i] = ELEMENTS.WATER.id;
                        }
                    }
                });
                continue;
            }

            // DISPENSERS
            if (type === ELEMENTS.DISPENSER.id || type === ELEMENTS.WATER_DISP.id || type === ELEMENTS.LAVA_DISP.id) {
                if (type === ELEMENTS.DISPENSER.id && y > 0 && grid[up] !== ELEMENTS.EMPTY.id && grid[up] !== ELEMENTS.DISPENSER.id) {
                    dispenserTypes[i] = grid[up];
                }

                if (y < HEIGHT - 1 && grid[down] === ELEMENTS.EMPTY.id) {
                    if (Math.random() < 0.15) {
                        let payload = ELEMENTS.SAND.id;
                        if (type === ELEMENTS.WATER_DISP.id) payload = ELEMENTS.WATER.id;
                        else if (type === ELEMENTS.LAVA_DISP.id) payload = ELEMENTS.LAVA.id;
                        else if (dispenserTypes[i] !== 0) payload = dispenserTypes[i];

                        nextGrid[down] = payload;
                        if (payload === ELEMENTS.FIRE.id) life[down] = 12;
                    }
                }
                continue;
            }

            // HOPPER
            if (type === ELEMENTS.HOPPER.id) {
                if (y > 0 && y < HEIGHT - 1) {
                    const aboveItem = grid[up];
                    if (aboveItem !== ELEMENTS.EMPTY.id && aboveItem !== ELEMENTS.WALL.id && aboveItem !== ELEMENTS.HOPPER.id) {
                        if (grid[down] === ELEMENTS.EMPTY.id) {
                            nextGrid[down] = aboveItem;
                            nextGrid[up] = ELEMENTS.EMPTY.id;
                        }
                    }
                }
                continue;
            }

            // FAN
            if (type === ELEMENTS.FAN.id) {
                for (let reach = 1; reach <= 6; reach++) {
                    const above = (y - reach) * WIDTH + x;
                    if (above >= 0 && (grid[above] === ELEMENTS.SMOKE.id || grid[above] === ELEMENTS.STEAM.id || grid[above] === ELEMENTS.GAS.id || grid[above] === ELEMENTS.METHANE.id || grid[above] === ELEMENTS.SAND.id)) {
                        const targetAir = (y - reach - 1) * WIDTH + x;
                        if (targetAir >= 0 && grid[targetAir] === ELEMENTS.EMPTY.id) {
                            nextGrid[targetAir] = grid[above];
                            nextGrid[above] = ELEMENTS.EMPTY.id;
                        }
                    }
                }
                continue;
            }

            // ELECTRICITY CONDUCTION
            if (type === ELEMENTS.ELECTRIC.id) {
                life[i]--;
                if (life[i] <= 0) {
                    nextGrid[i] = ELEMENTS.COPPER.id;
                } else {
                    [down, up, left, right].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT) {
                            if (grid[adj] === ELEMENTS.COPPER.id) {
                                nextGrid[adj] = ELEMENTS.ELECTRIC.id;
                                life[adj] = 4;
                            } else if (grid[adj] === ELEMENTS.WATER.id) {
                                nextGrid[adj] = ELEMENTS.FIRE.id;
                                life[adj] = 10;
                            } else if (grid[adj] === ELEMENTS.GUNPOWDER.id || grid[adj] === ELEMENTS.NITRO.id || grid[adj] === ELEMENTS.METHANE.id) {
                                nextGrid[adj] = ELEMENTS.FIRE.id;
                            }
                        }
                    });
                }
                continue;
            }

            // VOID & CLONE
            if (type === ELEMENTS.VOID.id) {
                [down, up, left, right].forEach(adj => {
                    if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] !== ELEMENTS.VOID.id) nextGrid[adj] = 0;
                });
                continue;
            }

            if (type === ELEMENTS.CLONE.id) {
                if (cloneTypes[i] === 0) {
                    [down, up, left, right].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] !== 0 && grid[adj] !== ELEMENTS.CLONE.id) {
                            cloneTypes[i] = grid[adj];
                        }
                    });
                } else {
                    [down, left, right, up].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] === ELEMENTS.EMPTY.id) {
                            nextGrid[adj] = cloneTypes[i];
                        }
                    });
                }
                continue;
            }

            // POWDERS
            if (type === ELEMENTS.SAND.id || type === ELEMENTS.GUNPOWDER.id || type === ELEMENTS.SALT.id || type === ELEMENTS.SEED.id || type === ELEMENTS.TERMITE.id || type === ELEMENTS.SNOW.id) {
                if (gDir !== 0 && targetY >= 0 && targetY < HEIGHT) {
                    const target = grid[down];
                    const isLiquid = target === ELEMENTS.WATER.id || target === ELEMENTS.OIL.id || target === ELEMENTS.ACID.id;

                    if (target === ELEMENTS.BOUNCY.id) {
                        const bounceY = (y - 3) * WIDTH + x;
                        if (bounceY >= 0 && grid[bounceY] === ELEMENTS.EMPTY.id) {
                            nextGrid[bounceY] = type;
                            nextGrid[i] = ELEMENTS.EMPTY.id;
                            continue;
                        }
                    }

                    if (target === ELEMENTS.EMPTY.id || isLiquid) {
                        nextGrid[i] = target;
                        nextGrid[down] = type;
                    } else if (x > 0 && (grid[downLeft] === ELEMENTS.EMPTY.id || isLiquid)) {
                        nextGrid[i] = grid[downLeft];
                        nextGrid[downLeft] = type;
                    } else if (x < WIDTH - 1 && (grid[downRight] === ELEMENTS.EMPTY.id || isLiquid)) {
                        nextGrid[i] = grid[downRight];
                        nextGrid[downRight] = type;
                    }
                }

                if (type === ELEMENTS.SEED.id) {
                    [down, left, right].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] === ELEMENTS.WATER.id) {
                            nextGrid[adj] = ELEMENTS.WOOD.id;
                        }
                    });
                } else if (type === ELEMENTS.TERMITE.id) {
                    [down, up, left, right].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] === ELEMENTS.WOOD.id) {
                            nextGrid[adj] = ELEMENTS.TERMITE.id;
                        }
                    });
                }
                continue;
            }

            // LIQUIDS
            if (type === ELEMENTS.WATER.id || type === ELEMENTS.OIL.id || type === ELEMENTS.ACID.id || type === ELEMENTS.LAVA.id || type === ELEMENTS.NITRO.id) {
                if (gDir !== 0 && targetY >= 0 && targetY < HEIGHT && grid[down] === ELEMENTS.EMPTY.id) {
                    nextGrid[i] = ELEMENTS.EMPTY.id;
                    nextGrid[down] = type;
                } else {
                    const dir = Math.random() < 0.5 ? -1 : 1;
                    const side = y * WIDTH + (x + dir);
                    if (x + dir >= 0 && x + dir < WIDTH && grid[side] === ELEMENTS.EMPTY.id) {
                        nextGrid[i] = ELEMENTS.EMPTY.id;
                        nextGrid[side] = type;
                    }
                }

                if (type === ELEMENTS.ACID.id) {
                    [down, left, right, up].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT && grid[adj] !== ELEMENTS.EMPTY.id && grid[adj] !== ELEMENTS.GLASS.id && grid[adj] !== ELEMENTS.ACID.id) {
                            if (Math.random() < 0.3) {
                                nextGrid[adj] = ELEMENTS.EMPTY.id;
                                nextGrid[i] = ELEMENTS.EMPTY.id;
                            }
                        }
                    });
                } else if (type === ELEMENTS.LAVA.id) {
                    [down, left, right, up].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT) {
                            if (grid[adj] === ELEMENTS.WATER.id) {
                                nextGrid[adj] = ELEMENTS.WALL.id;
                                nextGrid[i] = ELEMENTS.STEAM.id;
                                life[i] = 30;
                            } else if (grid[adj] === ELEMENTS.WOOD.id || grid[adj] === ELEMENTS.OIL.id || grid[adj] === ELEMENTS.NITRO.id) {
                                nextGrid[adj] = ELEMENTS.FIRE.id;
                            }
                        }
                    });
                }
                continue;
            }

            // GASES
            if (type === ELEMENTS.SMOKE.id || type === ELEMENTS.GAS.id || type === ELEMENTS.METHANE.id || type === ELEMENTS.STEAM.id) {
                life[i]--;
                if (life[i] <= 0 && type !== ELEMENTS.GAS.id && type !== ELEMENTS.METHANE.id) {
                    nextGrid[i] = (type === ELEMENTS.STEAM.id && Math.random() < 0.3) ? ELEMENTS.WATER.id : ELEMENTS.EMPTY.id;
                } else if (y > 0) {
                    if (grid[up] === ELEMENTS.EMPTY.id) {
                        nextGrid[i] = ELEMENTS.EMPTY.id;
                        nextGrid[up] = type;
                        life[up] = life[i];
                    }
                }
                continue;
            }

            // FIRE
            if (type === ELEMENTS.FIRE.id) {
                life[i]--;
                if (life[i] <= 0) {
                    nextGrid[i] = (Math.random() < 0.2) ? ELEMENTS.SMOKE.id : ELEMENTS.EMPTY.id;
                    if (nextGrid[i] === ELEMENTS.SMOKE.id) life[i] = 30;
                } else {
                    [down, up, left, right].forEach(adj => {
                        if (adj >= 0 && adj < WIDTH * HEIGHT) {
                            const target = grid[adj];
                            if (target === ELEMENTS.WOOD.id || target === ELEMENTS.OIL.id || target === ELEMENTS.GAS.id) {
                                nextGrid[adj] = ELEMENTS.FIRE.id;
                                life[adj] = 18;
                            } else if (target === ELEMENTS.GUNPOWDER.id || target === ELEMENTS.C4.id || target === ELEMENTS.NITRO.id || target === ELEMENTS.METHANE.id) {
                                const radius = (target === ELEMENTS.NITRO.id || target === ELEMENTS.METHANE.id) ? 10 : (target === ELEMENTS.C4.id) ? 7 : 4;
                                const centerY = Math.floor(adj / WIDTH);
                                const centerX = adj % WIDTH;
                                for (let ex = -radius; ex <= radius; ex++) {
                                    for (let ey = -radius; ey <= radius; ey++) {
                                        const eIdx = (centerY + ey) * WIDTH + (centerX + ex);
                                        if (eIdx >= 0 && eIdx < WIDTH * HEIGHT && grid[eIdx] !== ELEMENTS.WALL.id) {
                                            nextGrid[eIdx] = ELEMENTS.FIRE.id;
                                            life[eIdx] = 15;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }
        }
    }

    grid = nextGrid;
}

// Rendering Engine
function render() {
    const data = imgData.data;
    const colorMap = Object.values(ELEMENTS).reduce((acc, el) => {
        acc[el.id] = el.color;
        return acc;
    }, {});

    for (let i = 0; i < grid.length; i++) {
        const type = grid[i];
        const color = (type === ELEMENTS.CUSTOM.id && customColorMap[i]) ? customColorMap[i] : (colorMap[type] || colorMap[0]);
        const pixelIdx = i * 4;

        data[pixelIdx]     = color[0];
        data[pixelIdx + 1] = color[1];
        data[pixelIdx + 2] = color[2];
        data[pixelIdx + 3] = color[3];
    }

    ctx.putImageData(imgData, 0, 0);
}

// Main Frame Loop
let lastTime = performance.now();
let frameCount = 0;
function loop(now) {
    update();
    render();

    frameCount++;
    if (now - lastTime >= 1000) {
        document.getElementById('fps').textContent = 'FPS: ' + frameCount;
        frameCount = 0;
        lastTime = now;
    }

    requestAnimationFrame(loop);
}

loop(performance.now());
</script>
